# Config moshi-server pour kyutai/stt-1b-en_fr (FR + EN, ~0,5 s de latence, VAD sémantique).
# Base : kyutai-labs/unmute services/moshi-server/configs/stt.toml

static_dir = "./static/"
log_dir = "./logs"
instance_name = "stt"
# Clé attendue dans le header `kyutai-api-key` (ou `?auth_id=` dans l'URL).
authorized_ids = ["public_token"]

[modules.asr]
path = "/api/asr-streaming"
type = "BatchedAsr"
lm_model_file = "hf://kyutai/stt-1b-en_fr-candle/model.safetensors"
text_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/tokenizer_en_fr_audio_8000.model"
audio_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/mimi-pytorch-e351c8d8@125.safetensors"
asr_delay_in_tokens = 6
# Nombre de conversations simultanées. Plus haut = plus de VRAM.
batch_size = 2
conditioning_learnt_padding = true
temperature = 0.0
# Par défaut le modèle tourne en bf16, non supporté par les GPU Turing (GTX 16xx / RTX 20xx).
# f16 : ~2 Go de VRAM. Si la transcription sort vide ou incohérente, essayer "f32" (~4,5 Go).
# Sur une carte Ampere ou plus récente, commenter cette ligne (bf16).
dtype_override = "f16"

[modules.asr.model]
audio_vocab_size = 2049
text_in_vocab_size = 8001
text_out_vocab_size = 8000
audio_codebooks = 32

[modules.asr.model.transformer]
d_model = 2048
num_heads = 16
num_layers = 16
dim_feedforward = 8192
causal = true
norm_first = true
bias_ff = false
bias_attn = false
context = 750
max_period = 100000
use_conv_block = false
use_conv_bias = true
gating = "silu"
norm = "RmsNorm"
positional_embedding = "Rope"
conv_layout = false
conv_kernel_size = 3
kv_repeat = 1
max_seq_len = 40960

[modules.asr.model.extra_heads]
num_heads = 4
dim = 6
