services:
  kyutai-stt:
    build:
      context: ./services/kyutai-stt
      args:
        # 75 = GTX 16xx / RTX 20xx, 86 = RTX 30xx, 89 = RTX 40xx
        CUDA_COMPUTE_CAP: "75"
    ports:
      - "8080:8080"
    volumes:
      # Cache du modèle Hugging Face, pour ne pas le retélécharger à chaque démarrage.
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Serveur e-mail local : garde tous les e-mails envoyés par l'app (rien ne part sur Internet).
  # Boîte de réception : http://localhost:8025 — SMTP pour l'app : localhost:1025
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # Tunnel HTTPS public vers le front (Cloudflare « quick tunnel » : gratuit, sans compte ni domaine).
  # L'adresse change à chaque lancement : utiliser `npm run tunnel` (apps/server), qui la récupère.
  # Profil « tunnel » : jamais démarré par un simple `docker compose up`.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # Host réécrit en localhost:5173 : Vite accepte la requête comme si elle venait du PC.
    command: tunnel --no-autoupdate --url http://host.docker.internal:5173 --http-host-header localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hf-cache:
